name: Build SanjuSystemX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            ROOT="."
          else
            ROOT=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' -print -quit | xargs -r dirname)
          fi
          if [ -z "$ROOT" ]; then
            echo "No Gradle settings file found in repository."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle project root: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.project_root }}"
          gradle -p "$ROOT" assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-debug-apk
          path: "${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-release-apk
          path: "${{ steps.project.outputs.project_root }}/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
